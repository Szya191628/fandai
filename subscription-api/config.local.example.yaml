config-version: 8
server:
    host: "127.0.0.1"
    port: 8317
management:
    allow-remote: false
    disable-auto-update-panel: true
    secret-key: "$2a$10$REDACTED"
access:
    api-keys:
        - "cpa_REDACTED"
requests:
    proxy-url: "http://127.0.0.1:7990"
routing:
    strategy: "round-robin"
oauth:
    auth-dir: "F:/账号池/subscription-api/auth"
    providers:
        antigravity:
            antigravity-credits: false
observability:
    logs:
        debug: false
        logging-to-file: true
        logs-max-total-size-mb: 50
        error-logs-max-files: 5
        request-log: false
